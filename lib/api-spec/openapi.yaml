openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: HumanVerse API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: users
  - name: posts
  - name: circles
  - name: pitches
  - name: markers
  - name: notifications
  - name: messages
  - name: admin
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /admin/analytics/revenue:
    get:
      operationId: getAdminRevenueAnalytics
      tags: [admin]
      summary: Get platform revenue analytics
      responses:
        "200":
          description: Revenue analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevenueAnalytics"
        "403":
          description: Admin access required

  /admin/escrows:
    get:
      operationId: listAdminEscrows
      tags: [admin]
      summary: List active and disputed escrows
      responses:
        "200":
          description: Escrow agreements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminEscrow"
        "403":
          description: Admin access required

  /admin/escrows/{id}/resolve:
    post:
      operationId: resolveAdminEscrow
      tags: [admin]
      summary: Atomically release or refund an escrow
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveEscrowBody"
      responses:
        "200":
          description: Settlement result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscrowSettlement"
        "403":
          description: Admin access required

  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List users for account and KYC operations
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: role
          schema: { type: string }
        - in: query
          name: accountStatus
          schema: { type: string }
      responses:
        "200":
          description: Admin user directory
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "403":
          description: Admin access required

  /admin/users/{id}/status:
    patch:
      operationId: updateAdminUserStatus
      tags: [admin]
      summary: Update a user's role or account status
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminUserBody"
      responses:
        "200":
          description: Updated user summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "403":
          description: Admin access required

  /admin/audit-logs:
    get:
      operationId: listAdminAuditLogs
      tags: [admin]
      summary: List sanitized audit events
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminAuditLog"
        "403":
          description: Admin access required

  /admin/settings:
    get:
      operationId: getAdminPlatformSettings
      tags: [admin]
      summary: Get platform fee settings
      responses:
        "200":
          description: Current platform fee settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformSettings"
        "403":
          description: Admin access required
    patch:
      operationId: updateAdminPlatformSettings
      tags: [admin]
      summary: Update platform fee settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformSettingsPatch"
      responses:
        "200":
          description: Updated platform fee settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformSettings"
        "403":
          description: Admin access required

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /users/{id}/follow:
    post:
      operationId: toggleFollow
      tags: [users]
      summary: Toggle follow on a user
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowState"

  /posts:
    get:
      operationId: listPosts
      tags: [posts]
      summary: List feed posts
      parameters:
        - in: query
          name: feed
          required: false
          schema:
            type: string
            enum: [foryou, following, investors, hiring]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"
    post:
      operationId: createPost
      tags: [posts]
      summary: Create a post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

  /posts/{id}/like:
    post:
      operationId: toggleLike
      tags: [posts]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

  /posts/{id}/retweet:
    post:
      operationId: toggleRetweet
      tags: [posts]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

  /posts/{id}/tip:
    post:
      operationId: tipPost
      tags: [posts]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TipBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

  /circles:
    get:
      operationId: listCircles
      tags: [circles]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Circle"

  /circles/{id}/membership:
    post:
      operationId: toggleCircleMembership
      tags: [circles]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Circle"

  /pitches:
    get:
      operationId: listPitches
      tags: [pitches]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pitch"
    post:
      operationId: createPitch
      tags: [pitches]
      summary: Create a new pitch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePitchBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pitch"

  /pitches/{id}/back:
    post:
      operationId: backPitch
      tags: [pitches]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackPitchBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pitch"

  /markers:
    get:
      operationId: listMarkers
      tags: [markers]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Marker"

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /conversations:
    get:
      operationId: listConversations
      tags: [messages]
      summary: List the current user's conversations
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"

  /conversations/{userId}/messages:
    get:
      operationId: listMessages
      tags: [messages]
      summary: Get the message thread with a user
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a direct message to a user
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

components:
  parameters:
    IdParam:
      in: path
      name: id
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
      required: [ok]

    User:
      type: object
      properties:
        id: { type: string }
        handle: { type: string }
        name: { type: string }
        title: { type: string }
        company: { type: string }
        city: { type: string }
        country: { type: string }
        avatarKey: { type: string }
        verified: { type: boolean }
        followersCount: { type: integer }
        bio: { type: string }
        following: { type: boolean }
      required:
        - id
        - handle
        - name
        - title
        - company
        - city
        - country
        - avatarKey
        - verified
        - followersCount
        - bio
        - following

    FollowState:
      type: object
      properties:
        userId: { type: string }
        following: { type: boolean }
        followersCount: { type: integer }
      required: [userId, following, followersCount]

    Post:
      type: object
      properties:
        id: { type: string }
        authorId: { type: string }
        text: { type: string }
        imageKey:
          type: ["string", "null"]
        sponsored: { type: boolean }
        sponsorLabel:
          type: ["string", "null"]
        category: { type: string }
        likesCount: { type: integer }
        retweetsCount: { type: integer }
        commentsCount: { type: integer }
        tipsTotal: { type: integer }
        createdAt: { type: string, format: date-time }
        liked: { type: boolean }
        retweeted: { type: boolean }
      required:
        - id
        - authorId
        - text
        - sponsored
        - category
        - likesCount
        - retweetsCount
        - commentsCount
        - tipsTotal
        - createdAt
        - liked
        - retweeted

    CreatePostBody:
      type: object
      properties:
        text: { type: string }
        imageKey:
          type: ["string", "null"]
      required: [text]

    TipBody:
      type: object
      properties:
        amount: { type: integer }
      required: [amount]

    CreatePitchBody:
      type: object
      properties:
        title: { type: string }
        summary: { type: string }
        raising: { type: integer }
        stage: { type: string }
        industry: { type: string }
        city: { type: string }
        coverKey:
          type: ["string", "null"]
        x:
          type: ["number", "null"]
        y:
          type: ["number", "null"]
      required: [title, summary, raising, stage, industry, city]

    Circle:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        about: { type: string }
        category: { type: string }
        color: { type: string }
        coverKey:
          type: ["string", "null"]
        paid: { type: boolean }
        price: { type: integer }
        membersCount: { type: integer }
        activeNow: { type: integer }
        founderIds:
          type: array
          items: { type: string }
        joined: { type: boolean }
      required:
        - id
        - name
        - about
        - category
        - color
        - paid
        - price
        - membersCount
        - activeNow
        - founderIds
        - joined

    Pitch:
      type: object
      properties:
        id: { type: string }
        founderId: { type: string }
        title: { type: string }
        stage: { type: string }
        industry: { type: string }
        raising: { type: integer }
        raised: { type: integer }
        city: { type: string }
        summary: { type: string }
        coverKey:
          type: ["string", "null"]
        backersCount: { type: integer }
        trending: { type: boolean }
        backed: { type: boolean }
      required:
        - id
        - founderId
        - title
        - stage
        - industry
        - raising
        - raised
        - city
        - summary
        - backersCount
        - trending
        - backed

    BackPitchBody:
      type: object
      properties:
        amount: { type: integer }
      required: [amount]

    Marker:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        label: { type: string }
        city: { type: string }
        x: { type: number }
        y: { type: number }
        meta: { type: string }
        refId:
          type: ["string", "null"]
      required: [id, type, label, city, x, y, meta]

    Notification:
      type: object
      properties:
        id: { type: integer }
        userId: { type: string }
        type: { type: string }
        actorId:
          type: ["string", "null"]
        postId:
          type: ["string", "null"]
        circleId:
          type: ["string", "null"]
        pitchId:
          type: ["string", "null"]
        amount:
          type: ["integer", "null"]
        message: { type: string }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }
      required: [id, userId, type, message, read, createdAt]

    Message:
      type: object
      properties:
        id: { type: integer }
        fromUserId: { type: string }
        toUserId: { type: string }
        text: { type: string }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }
      required: [id, fromUserId, toUserId, text, read, createdAt]

    Conversation:
      type: object
      properties:
        peerId: { type: string }
        peer:
          $ref: "#/components/schemas/User"
        lastMessage:
          $ref: "#/components/schemas/Message"
        unread: { type: integer }
      required: [peerId, peer, lastMessage, unread]

    SendMessageBody:
      type: object
      properties:
        text: { type: string }
      required: [text]

    PlatformSettings:
      type: object
      properties:
        id: { type: string }
        escrowFeePercent: { type: number, minimum: 0, maximum: 100 }
        withdrawalFlatFee: { type: number, minimum: 0 }
        featuredPitchFee: { type: number, minimum: 0 }
        kycVerificationFee: { type: number, minimum: 0 }
        nftRoyaltyFeePercent: { type: number, minimum: 0, maximum: 100 }
        updatedAt: { type: string, format: date-time }
      required: [id, escrowFeePercent, withdrawalFlatFee, featuredPitchFee, kycVerificationFee, nftRoyaltyFeePercent, updatedAt]

    PlatformSettingsPatch:
      type: object
      properties:
        escrowFeePercent: { type: number, minimum: 0, maximum: 100 }
        withdrawalFlatFee: { type: number, minimum: 0 }
        featuredPitchFee: { type: number, minimum: 0 }
        kycVerificationFee: { type: number, minimum: 0 }
        nftRoyaltyFeePercent: { type: number, minimum: 0, maximum: 100 }

    RevenueAnalytics:
      type: object
      properties:
        totalPlatformRevenue: { type: number }
        monthlyRevenue: { type: number }
        pendingEscrowFunds: { type: number }
        activeSubscriptions: { type: integer }
        grossVolume: { type: number }
        feeTransactionCount: { type: integer }
        breakdown:
          type: array
          items:
            type: object
            properties:
              feeType: { type: string }
              total: { type: number }
              count: { type: integer }
            required: [feeType, total, count]
      required: [totalPlatformRevenue, monthlyRevenue, pendingEscrowFunds, activeSubscriptions, grossVolume, feeTransactionCount, breakdown]

    AdminEscrow:
      type: object
      properties:
        id: { type: string }
        projectId: { type: string }
        status: { type: string }
        disputeStatus: { type: ["string", "null"] }
        totalPiCommitted: { type: number }
        updatedAt: { type: string, format: date-time }
        buyer: { type: ["object", "null"] }
        seller: { type: ["object", "null"] }
        resolutionAvailable: { type: boolean }
      required: [id, projectId, status, totalPiCommitted, updatedAt, resolutionAvailable]

    ResolveEscrowBody:
      type: object
      properties:
        decision: { type: string, enum: [release_founder, refund_buyer] }
      required: [decision]

    EscrowSettlement:
      type: object
      properties:
        agreementId: { type: string }
        decision: { type: string }
        grossAmount: { type: number }
        feeAmount: { type: number }
        netAmount: { type: number }
        currency: { type: string }
      required: [agreementId, decision, grossAmount, feeAmount, netAmount, currency]

    AdminUser:
      type: object
      properties:
        id: { type: string }
        handle: { type: string }
        email: { type: ["string", "null"] }
        name: { type: string }
        role: { type: string }
        accountStatus: { type: string }
        kycStatus: { type: string }
        reputationScore: { type: integer }
        createdAt: { type: string, format: date-time }
      required: [id, handle, name, role, accountStatus, kycStatus, reputationScore, createdAt]

    UpdateAdminUserBody:
      type: object
      properties:
        role: { type: string }
        accountStatus: { type: string, enum: [active, suspended, banned] }

    AdminAuditLog:
      type: object
      properties:
        id: { type: string }
        entityType: { type: string }
        entityId: { type: string }
        actorId: { type: string }
        action: { type: string }
        userId: { type: ["string", "null"] }
        ipAddress: { type: ["string", "null"] }
        details: { type: object }
        createdAt: { type: string, format: date-time }
      required: [id, entityType, entityId, actorId, action, createdAt]
